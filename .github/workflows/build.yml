name: 打包

# 推送 v1.0.1 这样的版本标签：打包并发布到 Releases（已安装的应用会自动更新）
# 手动运行（Actions → 打包 → Run workflow）：只打包，产物在本次运行的 Artifacts 里，不发布
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # CI 在海外，直接用 GitHub 官方下载源
  npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
  npm_config_electron_custom_dir: v{{ version }}
  npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/

jobs:
  # 先建一个草稿 Release，两台打包机都往里面传文件，避免同时各建一个
  prepare:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查标签与 package.json 版本一致
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then echo "标签 $GITHUB_REF_NAME 与 package.json 版本 $v 不一致"; exit 1; fi
      - name: 创建草稿 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "FloatNote $GITHUB_REF_NAME" --generate-notes

  build:
    name: 打包 ${{ matrix.name }}
    needs: prepare
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            files: |
              release/*.exe
              release/*.yml
              release/*.blockmap
          - os: ubuntu-latest
            name: Linux
            files: |
              release/*.AppImage
              release/*.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 打包（推送标签时同时上传到草稿 Release）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm dist -- --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
      - uses: actions/upload-artifact@v4
        with:
          name: FloatNote-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # 两边都打包成功后，把草稿正式发布；已安装的应用从这时起能检查到新版本
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
